logging:
  path: /tmp/memory_log
  level: info

episodic_memory:
  enabled: true
  long_term_memory:
    embedder: ollama_embedder
    reranker: hybrid_reranker
    vector_graph_store: neo4j_store
  short_term_memory:
    llm_model: ollama_model
    message_capacity: 500
    max_message_length: 16000
    max_token_num: 8000

semantic_memory:
  enabled: true
  database: profile_storage
  config_database: profile_storage
  llm_model: ollama_model
  embedding_model: ollama_embedder

session_manager:
  database: profile_storage

episode_store:
  database: profile_storage

resources:
  language_models:
    ollama_model:
      provider: openai-chat-completions
      config:
        model: phi4-mini
        api_key: EMPTY
        base_url: http://host.docker.internal:11434/v1
  
  embedders:
    ollama_embedder:
      provider: openai
      config:
        model: nomic-embed-text
        api_key: EMPTY
        base_url: http://host.docker.internal:11434/v1
        dimensions: 768
  
  rerankers:
    hybrid_reranker:
      provider: rrf-hybrid
      config:
        reranker_ids:
          - embedder_reranker
          - bm25_reranker
    embedder_reranker:
      provider: embedder
      config:
        embedder_id: ollama_embedder
    bm25_reranker:
      provider: bm25
  
  databases:
    profile_storage:
      provider: postgres
      config:
        host: postgres
        port: 5432
        user: memmachine
        db_name: memmachine
        password: ${POSTGRES_PASSWORD}
    neo4j_store:
      provider: neo4j
      config:
        uri: bolt://neo4j:7687
        username: neo4j
        password: ${NEO4J_PASSWORD}
